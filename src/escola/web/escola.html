<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0D0C">
<title>Escola</title>
<link rel="icon" href="/web/icones/thalia.svg" type="image/svg+xml">
<link rel="preload" href="/web/fontes/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/web/base.css">
<link rel="stylesheet" href="/web/escola.css">
<script type="module" src="/web/escola.js"></script>
<script type="module" src="/web/caneta.js"></script>
</head>
<body>
<div class="app">
  <script>try { if (localStorage.getItem("escola.barra") === "recolhida") document.currentScript.parentElement.classList.add("recolhida"); } catch {}</script>
  <aside id="barra" class="lateral" aria-label="Menu da Escola">
    <div class="lateral-topo">
      <button id="recolher" class="botao-recolher" type="button" aria-controls="barra" aria-expanded="true" title="Recolher o menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span class="so-leitor">Recolher o menu</span></button>
      <a class="marca" href="#/"><span class="miniorbe" aria-hidden="true"></span><span class="marca-nome">Escola</span></a>
    </div>
    <nav class="nav" aria-label="Principal">
      <a class="nav-link" href="#/" data-rota="inicio" title="Início">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>Início</span></a>
      <a class="nav-link" href="#/cronograma" data-rota="cronograma" title="Cronograma">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M7.5 14h3M13.5 14h3M7.5 17h3"/></svg>
        <span>Cronograma</span></a>
      <a class="nav-link" href="#/erros" data-rota="erros" title="Caderno de erros">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5h-11z"/><path d="M6.5 3.5v17M4.5 8h4M4.5 12h4M4.5 16h4"/><path d="M11.5 9.5l4 4M15.5 9.5l-4 4"/></svg>
        <span>Caderno de erros</span><span id="caderno-conta" class="contador" hidden></span></a>
      <a class="nav-link" href="#/rotina" data-rota="rotina" title="Rotina">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Rotina</span></a>
      <a class="nav-link" href="#/situacao" data-rota="situacao" title="Situação dos concursos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8.5a6 6 0 0 1 12 0c0 6.5 2.5 8 2.5 8h-17S6 15 6 8.5z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>
        <span>Situação dos concursos</span><span id="novidades" class="ponto-novo" hidden></span></a>
      <a class="nav-link" href="#/turma" data-rota="turma" title="Turma">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M3 19.5c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6M17.5 14.8c1.9.6 3.1 2.2 3.5 4.7"/></svg>
        <span>Turma</span></a>
      <button class="nav-link caneta-lateral" type="button" data-ligar-caneta aria-pressed="false" title="Caneta">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5L9 20H4v-5z"/><path d="M12.5 6.5l5 5"/></svg>
        <span>Caneta</span></button>
    </nav>
    <section class="grupo" aria-labelledby="t-meus-cursos">
      <h2 id="t-meus-cursos" class="grupo-nome">Meus cursos</h2>
      <ul id="cursos-barra" class="cursos-barra"></ul>
    </section>
    <button id="perfil-barra" class="perfil-barra" type="button" title="Trocar de perfil" hidden>
      <span class="avatar mini" aria-hidden="true"></span>
      <span class="perfil-barra-texto"><span class="perfil-barra-nome"></span><span class="meta">Trocar de perfil</span></span></button>
    <a class="volta-thalia" href="https://desktop-aijqsic.tailcee703.ts.net/central" title="Voltar à Thalia" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      <span>Voltar à Thalia</span></a>
  </aside>
  <div class="conteudo">
    <header class="topo-estreito">
      <button id="abrir-menu" class="botao-menu" type="button" aria-controls="barra" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span class="so-leitor">Abrir o menu</span></button>
      <a class="marca" href="#/"><span class="miniorbe" aria-hidden="true"></span><span class="marca-nome">Escola</span></a>
      <button class="botao-menu caneta-topo" type="button" data-ligar-caneta aria-pressed="false" title="Caneta">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5L9 20H4v-5z"/><path d="M12.5 6.5l5 5"/></svg>
        <span class="so-leitor">Caneta</span></button>
    </header>
    <main id="pagina" class="pagina" tabindex="-1">
      <p class="carregando">Abrindo a Escola…</p>
    </main>
  </div>
</div>
<canvas id="caneta-tela" class="caneta-tela" aria-hidden="true"></canvas>
<div id="caneta-barra" class="caneta-barra" role="toolbar" aria-label="Caneta" hidden>
  <button type="button" data-ponta="caneta" aria-pressed="true" title="Caneta">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5L9 20H4v-5z"/><path d="M12.5 6.5l5 5"/></svg>
    <span>Caneta</span></button>
  <button type="button" data-ponta="marca" aria-pressed="false" title="Marca-texto">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 3.5l5 5-8 8-5-5z"/><path d="M7.5 11.5L4.5 14.5v3h3l3-3"/><path d="M13 21h7.5"/></svg>
    <span>Marca-texto</span></button>
  <button type="button" data-ponta="borracha" aria-pressed="false" title="Borracha">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20.5l-4.3-4.3a2 2 0 0 1 0-2.8l9.6-9.6a2 2 0 0 1 2.8 0l4.6 4.6a2 2 0 0 1 0 2.8L12 20.5"/><path d="M8 20.5h12.5M6.5 11l7.5 7.5"/></svg>
    <span>Borracha</span></button>
  <span class="caneta-fio" aria-hidden="true"></span>
  <button type="button" data-desfazer title="Desfazer" disabled>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14.5l-5-5 5-5"/><path d="M4 9.5h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    <span>Desfazer</span></button>
  <button type="button" data-limpar title="Limpar esta tela" disabled>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5L18 7M10 11v6M14 11v6"/></svg>
    <span>Limpar</span></button>
  <button type="button" class="caneta-pronto" data-pronto title="Pronto: volta a clicar na página">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    <span>Pronto</span></button>
</div>
<div id="veu" class="veu" hidden></div>
<div id="convite-juntos" class="convite-juntos" role="status" hidden></div>
<div id="perfis" class="perfis" hidden></div>
<dialog id="painel-perfil" class="painel-perfil" aria-labelledby="painel-titulo"></dialog>
<p id="anuncio" class="so-leitor" aria-live="polite"></p>
</body>
</html>
